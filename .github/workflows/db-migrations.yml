name: Database migrations

# Applies supabase/migrations/*.sql to PMRFP production when they merge to
# master, so nobody pastes SQL by hand (approved by Rishon, 2026-09-24).
#
# One-time setup:
#   1. Repo secrets SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens)
#      and SUPABASE_DB_PASSWORD (Project Settings → Database).
#   2. Run this workflow once with mode = baseline. It records the migrations
#      that were already applied by hand in the SQL editor, so they are never
#      re-run. Until the baseline exists, push runs refuse to apply anything.
#
# Every push run lists what will change, previews the SQL (--dry-run), then
# applies it. Write migrations to be idempotent (if not exists / drop policy
# if exists), like the ones already in supabase/migrations.

on:
  push:
    branches: [master]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
    inputs:
      mode:
        description: "push: apply new migrations. baseline: one-time, mark every migration in the repo as already applied."
        required: true
        default: push
        type: choice
        options: [push, baseline]

concurrency:
  group: db-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: tumexryzbzmtijvbloch
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'push' }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD as repository secrets (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Baseline (one-time)
        if: env.MODE == 'baseline'
        run: |
          versions=$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1 | tr '\n' ' ')
          echo "Marking as already applied: $versions"
          supabase migration repair --status applied $versions --linked --password "$SUPABASE_DB_PASSWORD" --yes
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Refuse to push without a baseline
        if: env.MODE == 'push'
        run: |
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" | tee list.txt
          first=$(ls supabase/migrations/*.sql | head -1 | xargs basename | cut -d_ -f1)
          # An applied migration shows its version in both the local and the
          # remote column. If the very first one isn't recorded remotely, the
          # history was never baselined and a push would re-run everything.
          if ! grep -E "${first}[^0-9].*${first}" list.txt > /dev/null; then
            echo "::error::Remote migration history has no baseline. Run this workflow once with mode = baseline."
            exit 1
          fi

      - name: Preview
        if: env.MODE == 'push'
        run: supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply
        if: env.MODE == 'push'
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes
