pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    client_max_body_size 32m;
    client_body_temp_path /tmp/request;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    resolver 127.0.0.11 ipv6=off valid=10s;
    proxy_http_version 1.1;
    proxy_set_header Host pmrfp.com;
    proxy_set_header X-Forwarded-Host pmrfp.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Vercel-Forwarded-For "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_redirect https://0.0.0.0:4323/ https://pmrfp.com/;
    proxy_redirect http://0.0.0.0:4323/ https://pmrfp.com/;
    proxy_buffering off;
    proxy_read_timeout 120s;

    server {
        listen 8443 ssl proxy_protocol;
        http2 on;
        server_name pmrfp.com;
        set_real_ip_from 172.16.7.1/32;
        real_ip_header proxy_protocol;
        ssl_certificate /tls/fullchain.pem;
        ssl_certificate_key /tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header X-PMRFP-Origin hostinger-vps always;

        if ($host != pmrfp.com) { return 421; }

        location = /sign-in {
            set $google_login http://pmrfp-native-auth-candidate:4323;
            proxy_pass $google_login;
        }

        location = /en/sign-in {
            set $google_login http://pmrfp-native-auth-candidate:4323;
            proxy_pass $google_login;
        }

        location = /fr/sign-in {
            set $google_login http://pmrfp-native-auth-candidate:4323;
            proxy_pass $google_login;
        }

        location = /es/sign-in {
            set $google_login http://pmrfp-native-auth-candidate:4323;
            proxy_pass $google_login;
        }

        location = /api/auth/google {
            set $google_login http://pmrfp-native-auth-candidate:4323;
            proxy_pass $google_login;
        }

        location = /api/auth/callback/google {
            set $google_login http://pmrfp-native-auth-candidate:4323;
            proxy_pass $google_login;
        }

        location ^~ /api/cron/ { return 404; }

        location = /api/stripe/webhook {
            client_max_body_size 1m;
            set $stripe_relay http://pmrfp-stripe-production-relay-webhook-1:4321;
            proxy_pass $stripe_relay;
        }

        location ^~ /_next/static/ {
            set $app http://pmrfp-native-auth-candidate:4323;
            proxy_intercept_errors on;
            recursive_error_pages on;
            error_page 404 = @google_login_static;
            proxy_pass $app;
        }

        location @google_login_static {
            root /legacy-google;
            try_files $uri @previous_static;
        }

        location @previous_static {
            root /legacy-r2;
            try_files $uri =404;
        }

        location / {
            set $app http://pmrfp-native-auth-candidate:4323;
            proxy_pass $app;
        }
    }
}
